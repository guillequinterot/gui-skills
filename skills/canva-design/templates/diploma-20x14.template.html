<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=2000">
<title>{{TITULO}} · 20 x 14 cm</title>
<!--
  PLANTILLA CANVA-READY — 2000 x 1400 px = 20 x 14 cm (100 px/cm), horizontal.
  Copia este archivo, cambia {{...}} y las capas. Reglas (skill canva-design, references/01 y 02):
   1. Una página = <div class="page" data-document-role="page"> de tamaño fijo en px. Varias páginas = varios divs hermanos.
   2. TODO es capa absoluta (.layer) con data-layer="NN Nombre". Cero flex/grid, cero transform, cero gradientes CSS,
      cero background:url(), cero box-shadow/filter. (Lo que no se pueda, se hornea a imagen con scripts/bake_assets.py.)
   3. Centrar = left explícito: left = (2000 - width)/2.  Nada de translateX(-50%).
   4. Texto = texto real (nunca en imagen). Solo Montserrat y Playfair Display (nativas de Canva) salvo que el usuario diga otra.
   5. Imágenes (<img>) NO las importa Canva: se suben aparte y se colocan con insert_fill. Aun así van en el HTML para el render local.
   6. Escala de impresión (100 px/cm): cuerpo >= 28 px (~8 pt), citas 36-44 px, nombre 100-125 px, cargo/firmas >= 19 px.
   7. Márgenes de seguridad: >= 50 px (5 mm) a los bordes para texto y logo.
   8. "11"/numerales grandes: Canva los coloca ~0,1 em MÁS ABAJO que el navegador → restar 0,1 em al top al montar en Canva.
   9. Cajas de texto con ancho >= 1,15 x el ancho real de la línea más larga (evita que "Y Color" se parta en Canva).
  10. Estilo mixto en una línea (negrita/cursiva/color) = <b>/<i> dentro del mismo div (Canva lo importa como regiones). Usa &nbsp; para que frases clave no se corten.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    /* paleta tonal de la marca (ejemplo de `caso-diplomas-01`): sustituir por la de la marca activa */
    --vino:#4E0814; --profundo:#8E0F1B; --marca:#DA111C; --vivo:#F2343B; --coral:#FF6B5E;
    --tinta:#1A1A1A; --sans:'Montserrat',sans-serif; --serif:'Playfair Display',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{margin:0;background:#fff}
  .page{position:relative;width:2000px;height:1400px;overflow:hidden;font-family:var(--sans);color:var(--tinta);background:#fff}
  .layer{position:absolute}
  .c{text-align:center}

  /* ---------- capas (ids = nombre corto; data-layer = nombre en Canva) ---------- */
  #bg{left:0;top:0;width:2000px;height:1400px}
  #logo{left:865px;top:60px;width:270px;height:auto}
  #cel{left:550px;top:250px;width:900px;font-weight:600;font-size:32px;letter-spacing:.62em;padding-left:.62em;text-transform:uppercase}
  #nombre{left:300px;top:700px;width:1400px;font-family:var(--serif);font-style:italic;font-weight:600;font-size:124px;line-height:1.1;color:var(--vino)}
  #cita{left:280px;top:880px;width:1440px;font-family:var(--serif);font-style:italic;font-weight:500;font-size:40px;line-height:1.35}
  #cita b{font-weight:700;color:var(--marca)}
  #cuerpo{left:330px;top:1004px;width:1340px;font-weight:400;font-size:30px;line-height:1.55}
  #cierre{left:200px;top:1206px;width:1600px;font-weight:700;font-size:33px;line-height:1.25;color:var(--profundo)}
  #fl{left:810px;top:1288px;width:380px;height:2px;background:var(--vino)}
  #fn{left:810px;top:1300px;width:380px;font-weight:700;font-size:24px;color:var(--vino)}
  #fc{left:810px;top:1330px;width:380px;font-weight:600;font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:var(--marca)}
</style>
</head>
<body>

<div class="page" data-document-role="page" data-label="{{OPCION}} – 20x14 cm">
  <img class="layer" id="bg" data-layer="01 Fondo" src="assets/fondo.jpg" alt="">
  <img class="layer" id="logo" data-layer="03 Logo" src="assets/logo.svg" alt="Marca">
  <div class="layer c" id="cel" data-layer="10 Etiqueta">Celebrando</div>
  <div class="layer c" id="nombre" data-layer="20 Nombre">{{NOMBRE}}</div>
  <div class="layer c" id="cita" data-layer="30 Cita">{{CITA con <b>frase&nbsp;clave</b>}}</div>
  <div class="layer c" id="cuerpo" data-layer="31 Cuerpo">{{CUERPO}}</div>
  <div class="layer c" id="cierre" data-layer="32 Cierre">{{CIERRE}}</div>
  <div class="layer" id="fl" data-layer="40 Línea firma"></div>
  <div class="layer c" id="fn" data-layer="41 Nombre firmante">Nombre Apellido</div>
  <div class="layer c" id="fc" data-layer="42 Cargo firmante">Director Gerente</div>
</div>

</body>
</html>
