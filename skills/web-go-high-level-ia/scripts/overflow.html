<!doctype html><html><body style="margin:0"><pre id="out">pending</pre>
<script>
const params = new URLSearchParams(location.search);
const W = +params.get('w') || 390, path = params.get('p') || '/';
const f = document.createElement('iframe');
f.style.cssText = 'width:'+W+'px;height:900px;border:0;position:absolute;left:0;top:0';
f.src = path;
document.body.appendChild(f);
f.onload = () => setTimeout(() => {
  const d = f.contentDocument, de = d.documentElement;
  const CW = de.clientWidth; const res = { w: W, cw: CW, scrollWidth: de.scrollWidth, clientWidth: de.clientWidth, scrollHeight: de.scrollHeight, over: [] };
  d.querySelectorAll('body *').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width > 0 && (r.right > CW + 1 || r.left < -1)) {
      // ignorar contenido dentro de carruseles con scroll propio
      let p = el.parentElement, inScroller = false;
      while (p) { const s = getComputedStyle(p); if ((s.overflowX === 'auto' || s.overflowX === 'scroll' || s.overflowX==='hidden') && p !== d.body && p !== de) { inScroller = true; break; } p = p.parentElement; }
      if (!inScroller && !el.closest('.drawer')) res.over.push(el.tagName.toLowerCase() + '.' + (el.className && el.className.baseVal === undefined ? el.className : '') + ' L' + Math.round(r.left) + ' R' + Math.round(r.right) + ' · ' + (el.textContent||'').trim().slice(0,40));
    }
  });
  res.over = res.over.slice(0, 40);
  // imágenes sin alt / rotas
  res.imgsRotas = [...d.images].filter(i => i.complete && i.naturalWidth === 0).length;
  // elementos interactivos pequeños (<44px de alto o ancho) visibles
  res.tapPequenos = [...d.querySelectorAll('a,button,summary,input,select')].filter(e => { const r = e.getBoundingClientRect(); return r.width>0 && r.height>0 && (r.height < 40 || r.width < 40) && getComputedStyle(e).visibility!=='hidden'; }).map(e => e.tagName.toLowerCase()+' '+Math.round(e.getBoundingClientRect().width)+'x'+Math.round(e.getBoundingClientRect().height)+' '+(e.textContent||e.getAttribute('aria-label')||'').trim().slice(0,30)).slice(0,30);
  document.getElementById('out').textContent = JSON.stringify(res, null, 1);
}, 6000);
</script></body></html>
